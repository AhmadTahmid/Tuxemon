events:
  Initialize skyglass_garden:
    type: event
    conditions:
    - not variable_set skyglass_garden_initialized
    actions:
    - set_environment grass
    - set_variable skyglass_garden_initialized:yes
  Materialize skyglass_garden sentinel:
    type: event
    conditions:
    - not char_exists knight2
    actions:
    - create_npc knight2,24,14
  Arm skyglass_garden sentinel:
    type: event
    conditions:
    - is char_exists knight2
    - is party_size knight2,equals,0
    actions:
    - add_monster toucanary,3,knight2
  Challenge skyglass_garden sentinel:
    type: event
    behav:
    - talk knight2
    conditions:
    - is variable_set province_stage:echo_wilds_attuned
    - not char_defeated knight2
    actions:
    - translated_dialog The Skyglass Garden has chosen its own answer. Pass through
      it, not around it.
    - start_battle player,knight2
  Record skyglass_garden sentinel victory:
    type: event
    conditions:
    - is battle_outcome player,won,knight2
    - is current_state WorldState
    - is variable_set province_stage:echo_wilds_attuned
    actions:
    - translated_dialog The sentinel yields. The Skyglass Garden opens toward its
      sigil.
    - set_variable province_stage:skyglass_garden_open
  The Skyglass Garden sentinel remembers:
    type: event
    behav:
    - talk knight2
    conditions:
    - is variable_set province_stage:skyglass_garden_open
    actions:
    - translated_dialog The path ahead is yours because you survived its reply.
  Recover skyglass_garden sigil:
    type: event
    x: 44
    y: 13
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    - is variable_set province_stage:skyglass_garden_open
    actions:
    - translated_dialog The Skyglass Garden resolves into a sigil the archive can
      remember.
    - set_variable province_stage:skyglass_garden_attuned
  The Skyglass Garden shrine remembered:
    type: event
    x: 44
    y: 13
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    - is variable_set province_stage:skyglass_garden_attuned
    actions:
    - translated_dialog The empty shrine points west, toward the monolith that remembers
      home.
  Return from skyglass_garden:
    type: event
    x: 1
    y: 16
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    actions:
    - translated_dialog The monolith folds the Echo Wilds back into town.
    - transition_teleport player,unmapped_province.tmx,42,17,0.3
