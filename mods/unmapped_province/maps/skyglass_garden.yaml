events:
  Initialize skyglass_garden:
    type: event
    conditions:
    - not variable_set skyglass_garden_initialized
    actions:
    - set_environment grass
    - set_variable skyglass_garden_initialized:yes
  Materialize skyglass_garden witness:
    type: event
    conditions:
    - not char_exists knight2
    actions:
    - create_npc knight2,24,14
  The Skyglass Garden witness explains:
    type: event
    behav:
    - talk knight2
    conditions:
    - is variable_set province_stage:echo_wilds_attuned
    actions:
    - translated_dialog A survey cannot be won. Choose how to listen, then let the
      horizon and root answer.
  Choose chorus in skyglass_garden:
    type: event
    x: 14
    y: 8
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    - is variable_set province_stage:echo_wilds_attuned
    - not variable_set skyglass_garden_alignment
    actions:
    - translated_dialog You tune the first lens through chorus.
    - set_variable skyglass_garden_alignment:chorus
    - set_variable skyglass_garden_origin_seen:yes
  Choose silence in skyglass_garden:
    type: event
    x: 33
    y: 24
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    - is variable_set province_stage:echo_wilds_attuned
    - not variable_set skyglass_garden_alignment
    actions:
    - translated_dialog You tune the first lens through silence.
    - set_variable skyglass_garden_alignment:silence
    - set_variable skyglass_garden_origin_seen:yes
  Observe horizon in skyglass_garden:
    type: event
    x: 33
    y: 8
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    - is variable_set province_stage:echo_wilds_attuned
    - not variable_set skyglass_garden_horizon_seen
    actions:
    - translated_dialog The horizon returns a fact no battle could reveal.
    - set_variable skyglass_garden_horizon_seen:yes
  Observe root in skyglass_garden:
    type: event
    x: 14
    y: 24
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    - is variable_set province_stage:echo_wilds_attuned
    - not variable_set skyglass_garden_root_seen
    actions:
    - translated_dialog The root returns a fact no battle could reveal.
    - set_variable skyglass_garden_root_seen:yes
  Recover skyglass_garden sigil via chorus:
    type: event
    x: 44
    y: 13
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    - is variable_set province_stage:echo_wilds_attuned
    - is variable_set skyglass_garden_alignment:chorus
    - is variable_set skyglass_garden_origin_seen:yes
    - is variable_set skyglass_garden_horizon_seen:yes
    - is variable_set skyglass_garden_root_seen:yes
    actions:
    - translated_dialog The Skyglass Garden preserves your chorus reading as a sigil.
    - set_variable province_stage:skyglass_garden_attuned
  Recover skyglass_garden sigil via silence:
    type: event
    x: 44
    y: 13
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    - is variable_set province_stage:echo_wilds_attuned
    - is variable_set skyglass_garden_alignment:silence
    - is variable_set skyglass_garden_origin_seen:yes
    - is variable_set skyglass_garden_horizon_seen:yes
    - is variable_set skyglass_garden_root_seen:yes
    actions:
    - translated_dialog The Skyglass Garden preserves your silence reading as a sigil.
    - set_variable province_stage:skyglass_garden_attuned
  Return from skyglass_garden:
    type: event
    x: 1
    y: 16
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    actions:
    - translated_dialog The Skyglass Garden folds back into town without erasing your
      reading.
    - transition_teleport player,unmapped_province.tmx,42,17,0.3
  Clear unaligned projection for skyglass_garden_alignment:
    type: init
    conditions:
    - not variable_set skyglass_garden_alignment
    actions:
    - set_layer none
  Project visible phenotype skyglass_garden:chorus:
    type: init
    conditions:
    - is variable_set skyglass_garden_alignment:chorus
    actions:
    - set_layer 71:255:71:44
  Project visible phenotype skyglass_garden:silence:
    type: init
    conditions:
    - is variable_set skyglass_garden_alignment:silence
    actions:
    - set_layer 255:71:255:44
