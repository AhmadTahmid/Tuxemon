events:
  Materialize bob:
    type: event
    conditions:
    - not char_exists bob
    actions:
    - create_npc bob,26,23
  Materialize maple_wren:
    type: event
    conditions:
    - not char_exists maple_wren
    actions:
    - create_npc maple_wren,15,14
  Materialize npc_test:
    type: event
    conditions:
    - not char_exists npc_test
    actions:
    - create_npc npc_test,15,33
  Clear unaligned projection for skyglass_garden_alignment:
    type: init
    conditions:
    - not variable_set skyglass_garden_alignment
    actions:
    - set_layer none
  Project visible phenotype skyglass_garden:chorus:
    type: init
    conditions:
    - is variable_set skyglass_garden_alignment:chorus
    actions:
    - set_layer 71:255:71:44
  Materialize spatial echo skyglass_garden:chorus:
    type: event
    conditions:
    - is variable_set skyglass_garden_alignment:chorus
    - not char_exists knight2
    actions:
    - create_npc knight2,11,14
  Read spatial echo skyglass_garden:chorus:
    type: event
    behav:
    - talk knight2
    conditions:
    - is variable_set skyglass_garden_alignment:chorus
    actions:
    - translated_dialog The chorus echo has occupied a different place in town.
  Project visible phenotype skyglass_garden:silence:
    type: init
    conditions:
    - is variable_set skyglass_garden_alignment:silence
    actions:
    - set_layer 255:71:255:44
  Materialize spatial echo skyglass_garden:silence:
    type: event
    conditions:
    - is variable_set skyglass_garden_alignment:silence
    - not char_exists knight2
    actions:
    - create_npc knight2,37,34
  Read spatial echo skyglass_garden:silence:
    type: event
    behav:
    - talk knight2
    conditions:
    - is variable_set skyglass_garden_alignment:silence
    actions:
    - translated_dialog The silence echo has occupied a different place in town.
  Initialize semantic slice:
    type: event
    conditions:
    - not variable_set foundry_initialized
    actions:
    - set_environment grass
    - add_monster bamboon,5
    - set_variable province_stage:arrival
    - set_variable foundry_initialized:yes
    - translated_dialog The province has no map yet. Find the archivist beneath the
      northern slate roof.
  Arm the duelist:
    type: event
    conditions:
    - is char_exists npc_test
    - is party_size npc_test,equals,0
    actions:
    - add_monster rockitten,5,npc_test
  Archivist offers charter:
    type: event
    behav:
    - talk maple_wren
    conditions:
    - is variable_set province_stage:arrival
    actions:
    - translated_dialog Three missing sigils keep the province from remembering itself.
      The eastern gate will compile one route at a time.
    - set_variable province_stage:chartered
  Archivist reminder:
    type: event
    behav:
    - talk maple_wren
    conditions:
    - is variable_set province_stage:chartered
    actions:
    - translated_dialog Begin at the eastern gate. Survive each region, recover its
      sigil, and return for the next.
  Enter The Echo Wilds:
    type: event
    x: 42
    y: 16
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    - is variable_set province_stage:chartered
    actions:
    - translated_dialog The gate compiles The Echo Wilds from the next unresolved
      promise.
    - transition_teleport player,echo_wilds.tmx,3,17,0.3
  Reenter The Echo Wilds:
    type: event
    x: 42
    y: 16
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    - is variable_set province_stage:echo_wilds_open
    actions:
    - transition_teleport player,echo_wilds.tmx,3,17,0.3
  Enter The Skyglass Garden:
    type: event
    x: 42
    y: 16
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    - is variable_set province_stage:echo_wilds_attuned
    actions:
    - translated_dialog The gate compiles The Skyglass Garden from the next unresolved
      promise.
    - transition_teleport player,skyglass_garden.tmx,3,16,0.3
  Enter The Root Vault:
    type: event
    x: 42
    y: 16
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    - is variable_set province_stage:skyglass_garden_attuned
    actions:
    - translated_dialog The gate compiles The Root Vault from the next unresolved
      promise.
    - transition_teleport player,root_vault.tmx,3,18,0.3
  Reenter The Root Vault:
    type: event
    x: 42
    y: 16
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    - is variable_set province_stage:root_vault_open
    actions:
    - transition_teleport player,root_vault.tmx,3,18,0.3
  Cartographer observes:
    type: event
    behav:
    - talk bob
    conditions:
    - not variable_set skyglass_garden_alignment
    actions:
    - translated_dialog This town was compiled from promises. Its walls are consequences
      rather than drawings.
  Cartographer responds to chorus:
    type: event
    behav:
    - talk bob
    conditions:
    - is variable_set skyglass_garden_alignment:chorus
    actions:
    - translated_dialog Your chorus survey changed what the atlas believes about every
      later path.
  Cartographer responds to silence:
    type: event
    behav:
    - talk bob
    conditions:
    - is variable_set skyglass_garden_alignment:silence
    actions:
    - translated_dialog Your silence survey changed what the atlas believes about
      every later path.
  Duel for the map seal:
    type: event
    behav:
    - talk npc_test
    conditions:
    - is variable_set province_stage:archive_restored
    - not char_defeated npc_test
    actions:
    - translated_dialog A map is only true if it survives resistance. Show me your
      turncraft.
    - start_battle player,npc_test
  Record duel victory:
    type: event
    conditions:
    - is battle_outcome player,won,npc_test
    - is current_state WorldState
    - is variable_set province_stage:archive_restored
    actions:
    - translated_dialog The map seal answers. Return to the archivist.
    - set_variable province_stage:trial_won
  Archivist completes map:
    type: event
    behav:
    - talk maple_wren
    conditions:
    - is variable_set province_stage:trial_won
    actions:
    - translated_dialog The province remembers its name. You are its first true Cartographer.
    - set_variable province_stage:province_mapped
  Archivist epilogue:
    type: event
    behav:
    - talk maple_wren
    conditions:
    - is variable_set province_stage:province_mapped
    actions:
    - translated_dialog The atlas is complete. Walk freely; every path you proved
      remains open.
  Inspect archive:
    type: event
    x: 15
    y: 13
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    actions:
    - translated_dialog Archive. Its sealed door hums with map-light.
  Inspect observatory:
    type: event
    x: 39
    y: 14
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    actions:
    - translated_dialog Observatory. Its sealed door hums with map-light.
  Inspect guild:
    type: event
    x: 15
    y: 32
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    actions:
    - translated_dialog Guild. Its sealed door hums with map-light.
  Inspect clinic:
    type: event
    x: 40
    y: 32
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    actions:
    - translated_dialog The clinic tunes every tired creature back to its remembered
      shape.
    - set_monster_health
