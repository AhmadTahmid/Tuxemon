events:
  Materialize bob:
    type: event
    conditions:
    - not char_exists bob
    actions:
    - create_npc bob,26,23
  Materialize maple_wren:
    type: event
    conditions:
    - not char_exists maple_wren
    actions:
    - create_npc maple_wren,15,14
  Materialize npc_test:
    type: event
    conditions:
    - not char_exists npc_test
    actions:
    - create_npc npc_test,15,33
  Initialize semantic slice:
    type: event
    conditions:
    - not variable_set foundry_initialized
    actions:
    - set_environment grass
    - add_monster bamboon,5
    - set_variable province_stage:arrival
    - set_variable foundry_initialized:yes
    - translated_dialog The province has no map yet. Find the archivist beneath the
      northern slate roof.
  Arm the duelist:
    type: event
    conditions:
    - is char_exists npc_test
    - is party_size npc_test,equals,0
    actions:
    - add_monster rockitten,5,npc_test
  Archivist offers charter:
    type: event
    behav:
    - talk maple_wren
    conditions:
    - is variable_set province_stage:arrival
    actions:
    - translated_dialog The streets have forgotten their own shape. Find the echo
      shard beside the observatory.
    - set_variable province_stage:chartered
  Archivist reminder:
    type: event
    behav:
    - talk maple_wren
    conditions:
    - is variable_set province_stage:chartered
    actions:
    - translated_dialog Follow the loop road east. The shard waits below the indigo
      observatory.
  Enter Echo Wilds:
    type: event
    x: 42
    y: 16
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    - is variable_set province_stage:chartered
    actions:
    - translated_dialog The gate unfolds a forest from the echo shard's possible locations.
    - transition_teleport player,echo_wilds.tmx,3,17,0.3
  Cartographer observes:
    type: event
    behav:
    - talk bob
    actions:
    - translated_dialog This town was compiled from promises. Its walls are consequences
      rather than drawings.
  Duel for the map seal:
    type: event
    behav:
    - talk npc_test
    conditions:
    - is variable_set province_stage:shard_recovered
    - not char_defeated npc_test
    actions:
    - translated_dialog A map is only true if it survives resistance. Show me your
      turncraft.
    - start_battle player,npc_test
  Record duel victory:
    type: event
    conditions:
    - is battle_outcome player,won,npc_test
    - is current_state WorldState
    - is variable_set province_stage:shard_recovered
    actions:
    - translated_dialog The map seal answers. Return to the archivist.
    - set_variable province_stage:trial_won
  Archivist completes map:
    type: event
    behav:
    - talk maple_wren
    conditions:
    - is variable_set province_stage:trial_won
    actions:
    - translated_dialog The province remembers its name. You are its first true Cartographer.
    - set_variable province_stage:province_mapped
  Archivist epilogue:
    type: event
    behav:
    - talk maple_wren
    conditions:
    - is variable_set province_stage:province_mapped
    actions:
    - translated_dialog The atlas is complete. Walk freely; every path you proved
      remains open.
  Inspect archive:
    type: event
    x: 15
    y: 13
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    actions:
    - translated_dialog Archive. Its sealed door hums with map-light.
  Inspect observatory:
    type: event
    x: 39
    y: 14
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    actions:
    - translated_dialog Observatory. Its sealed door hums with map-light.
  Inspect guild:
    type: event
    x: 15
    y: 32
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    actions:
    - translated_dialog Guild. Its sealed door hums with map-light.
  Inspect clinic:
    type: event
    x: 40
    y: 32
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    actions:
    - translated_dialog The clinic tunes every tired creature back to its remembered
      shape.
    - set_monster_health
