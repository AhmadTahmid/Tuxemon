events:
  Initialize root_vault:
    type: event
    conditions:
    - not variable_set root_vault_initialized
    actions:
    - set_environment grass
    - set_variable root_vault_initialized:yes
  Materialize root_vault sentinel:
    type: event
    conditions:
    - not char_exists knight3
    actions:
    - create_npc knight3,28,18
  Arm root_vault sentinel:
    type: event
    conditions:
    - is char_exists knight3
    - is party_size knight3,equals,0
    actions:
    - add_monster vivipere,5,knight3
  Challenge root_vault sentinel:
    type: event
    behav:
    - talk knight3
    conditions:
    - is variable_set province_stage:skyglass_garden_attuned
    - not char_defeated knight3
    actions:
    - translated_dialog The Root Vault has chosen its own answer. Pass through it,
      not around it.
    - start_battle player,knight3
  Record root_vault sentinel victory:
    type: event
    conditions:
    - is battle_outcome player,won,knight3
    - is current_state WorldState
    - is variable_set province_stage:skyglass_garden_attuned
    actions:
    - translated_dialog The sentinel yields. The Root Vault opens toward its sigil.
    - set_variable province_stage:root_vault_open
  The Root Vault sentinel remembers:
    type: event
    behav:
    - talk knight3
    conditions:
    - is variable_set province_stage:root_vault_open
    actions:
    - translated_dialog The path ahead is yours because you survived its reply.
  Recover root_vault sigil:
    type: event
    x: 52
    y: 15
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    - is variable_set province_stage:root_vault_open
    actions:
    - translated_dialog The Root Vault resolves into a sigil the archive can remember.
    - set_variable province_stage:archive_restored
  The Root Vault shrine remembered:
    type: event
    x: 52
    y: 15
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    - is variable_set province_stage:archive_restored
    actions:
    - translated_dialog The empty shrine points west, toward the monolith that remembers
      home.
  Return from root_vault:
    type: event
    x: 1
    y: 18
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    actions:
    - translated_dialog The monolith folds the Echo Wilds back into town.
    - transition_teleport player,unmapped_province.tmx,42,17,0.3
