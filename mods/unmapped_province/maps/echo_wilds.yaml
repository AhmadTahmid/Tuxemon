    - translated_dialog The sentinel yields. The Echo Wilds opens toward its sigil.
    - set_variable province_stage:echo_wilds_open
  The Echo Wilds sentinel remembers:
    type: event
    behav:
    - talk knight1
    conditions:
    - is variable_set province_stage:echo_wilds_open
