events:
  Initialize echo wilds:
    type: event
    conditions:
    - not variable_set echo_wilds_initialized
    actions:
    - set_environment grass
    - set_variable echo_wilds_initialized:yes
  Recover echo shard:
    type: event
    x: 48
    y: 20
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    - is variable_set province_stage:chartered
    actions:
    - 'translated_dialog The wild circuit resolves into one memory: every path can
      return.'
